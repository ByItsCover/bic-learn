name: learning-batch

on:
  workflow_dispatch:
    inputs:
      jobName:
        description: 'Job Name'
        required: true
        type: string
      jobType:
        description: 'Learning Job Type'
        required: true
        default: 'tune_users'
        type: choice
        options:
          - full_train
          - tune_users
          - create_tables
      memory:
        description: 'Memory size for Learning Job'
        required: true
        default: 2048
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  submit-batch:
    name: Submit Batch Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials for github actions
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}

      - name: Submit Training Job
        if: ${{ inputs.jobType == 'tune_users' || inputs.jobType == 'full_train' }}
        run: |
          aws batch submit-job \
              --job-name ${{ inputs.jobName }}-${{ github.run_id }} \
              --job-queue learning-queue \
              --job-definition learning_batch_job_definition \
              --container-overrides '{
                "resourceRequirements": [
                  {
                    "type": "GPU",
                    "value": "1"
                  },
                  {
                    "type": "MEMORY",
                    "value": "${{ inputs.memory }}"
                  }
                ],
                "environment": [
                  {
                    "name": "JOB_TYPE",
                    "value": "${{ inputs.jobType }}"
                  }
                ]
              }'

      - name: Submit Create Tables Job
        if: ${{ inputs.jobType == 'create_tables' }}
        run: |
          aws batch submit-job \
              --job-name ${{ inputs.jobName }}-${{ github.run_id }} \
              --job-queue learning-queue \
              --job-definition learning_batch_job_definition \
              --container-overrides '{
                "resourceRequirements": [
                  {
                    "type": "MEMORY",
                    "value": "${{ inputs.memory }}"
                  }
                ],
                "environment": [
                  {
                    "name": "JOB_TYPE",
                    "value": "${{ inputs.jobType }}"
                  }
                ]
              }'
